# Builds the librarian portal and pushes it to GHCR as ghcr.io/<owner>/lms-admin.
#
# Vite builds are the heaviest thing in this project — this is why they happen
# here and not on anyone's laptop or on a 1 GB server.
#
# Set VITE_COLLEGE_CODE as a repository variable (Settings -> Secrets and
# variables -> Actions -> Variables). It is baked into the bundle, so a
# different college needs a different build.

name: publish admin image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/lms-admin

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: require VITE_COLLEGE_CODE
        run: |
          if [ -z "${{ vars.VITE_COLLEGE_CODE }}" ]; then
            echo "::error::Set the repository variable VITE_COLLEGE_CODE (e.g. GICCL)."
            echo "Without it the portal sends the wrong college code and every login fails."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_COLLEGE_CODE=${{ vars.VITE_COLLEGE_CODE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
